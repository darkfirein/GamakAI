name: Android CI Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Dummy .env for Build Secrets Plugin
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'AIzaSyDummyKeyForCIValidation12345678' }}" > .env

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew || true

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace || gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace || gradle :app:assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gamak-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
